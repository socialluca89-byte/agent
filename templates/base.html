<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Job Search Agent{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3349;
      --accent: #4f7cff;
      --accent-dim: #1e2e66;
      --green: #22c55e;
      --green-dim: #14532d;
      --red: #ef4444;
      --red-dim: #7f1d1d;
      --yellow: #eab308;
      --yellow-dim: #713f12;
      --text: #e2e8f0;
      --text-muted: #64748b;
      --radius: 10px;
      --font: 'Segoe UI', system-ui, sans-serif;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Nav ── */
    nav {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 1.5rem;
      display: flex;
      align-items: center;
      gap: 2rem;
      height: 56px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .nav-brand {
      font-weight: 700;
      font-size: 1.05rem;
      color: var(--accent);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: .5rem;
    }
    .nav-brand span { font-size: 1.2rem; }
    nav a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: .9rem;
      padding: .3rem .6rem;
      border-radius: 6px;
      transition: color .15s, background .15s;
    }
    nav a:hover, nav a.active { color: var(--text); background: var(--surface2); }
    .nav-spacer { flex: 1; }

    /* ── Layout ── */
    .container { max-width: 1200px; margin: 0 auto; padding: 1.5rem; }

    /* ── Cards ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
    }

    /* ── Badges ── */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: .3rem;
      padding: .2rem .6rem;
      border-radius: 999px;
      font-size: .75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .badge-green  { background: var(--green-dim);  color: var(--green); }
    .badge-red    { background: var(--red-dim);    color: var(--red); }
    .badge-yellow { background: var(--yellow-dim); color: var(--yellow); }
    .badge-blue   { background: var(--accent-dim); color: var(--accent); }
    .badge-gray   { background: var(--surface2);   color: var(--text-muted); }

    /* ── Buttons ── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      padding: .55rem 1.1rem;
      border-radius: 8px;
      border: none;
      font-size: .875rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .15s, transform .1s;
      text-decoration: none;
    }
    .btn:active { transform: scale(.97); }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-green   { background: var(--green);  color: #000; }
    .btn-red     { background: var(--red);    color: #fff; }
    .btn-ghost   { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
    .btn:disabled { opacity: .45; cursor: not-allowed; }

    /* ── Form elements ── */
    select, input[type=text], textarea {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: .55rem .8rem;
      font-size: .875rem;
      font-family: var(--font);
      outline: none;
      width: 100%;
      transition: border-color .15s;
    }
    select:focus, input[type=text]:focus, textarea:focus {
      border-color: var(--accent);
    }
    textarea { resize: vertical; line-height: 1.6; }
    label { font-size: .8rem; color: var(--text-muted); display: block; margin-bottom: .3rem; }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: .8rem 1.2rem;
      border-radius: 10px;
      font-size: .875rem;
      font-weight: 500;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity .2s, transform .2s;
      pointer-events: none;
      z-index: 999;
    }
    #toast.show { opacity: 1; transform: translateY(0); }

    /* ── Utilities ── */
    .flex { display: flex; }
    .flex-col { flex-direction: column; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }
    .gap-1 { gap: .5rem; }
    .gap-2 { gap: 1rem; }
    .gap-3 { gap: 1.5rem; }
    .mt-1 { margin-top: .5rem; }
    .mt-2 { margin-top: 1rem; }
    .mt-3 { margin-top: 1.5rem; }
    .text-muted { color: var(--text-muted); }
    .text-sm { font-size: .875rem; }
    .text-xs { font-size: .75rem; }
    .font-bold { font-weight: 700; }
    .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .w-full { width: 100%; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
    @media(max-width:700px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <nav>
    <a class="nav-brand" href="/"><span>🔍</span> Job Agent</a>
    <a href="/" {% if request.path == '/' %}class="active"{% endif %}>Offerte</a>
    <a href="/candidature" {% if request.path == '/candidature' %}class="active"{% endif %}>Candidature</a>
    <div class="nav-spacer"></div>
    <span class="text-muted text-sm">da remoto · smart working</span>
  </nav>

  {% block content %}{% endblock %}

  <div id="toast"></div>

  <script>
    function toast(msg, ok = true) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.borderColor = ok ? 'var(--green)' : 'var(--red)';
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    async function setStatus(jobId, status, note, messaggio) {
      const r = await fetch('/api/validate', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({id: jobId, status, note: note||'', messaggio: messaggio||''})
      });
      const d = await r.json();
      return d.ok;
    }
  </script>
</body>
</html>
